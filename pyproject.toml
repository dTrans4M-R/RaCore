[project]
name = "racore"
version = "0.1.1"
description = "A grounded, real-time, memory-aware retrieval engine with evaluation as a first-class concern."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Tushar", email = "stushar.engineer@gmail.com" }]
keywords = ["rag", "retrieval", "grounding", "evaluation", "memory", "llm"]
dependencies = []

[project.optional-dependencies]
# Opt-in provider adapters. The core stays dependency-free (ADR-0007); these are only
# needed when you swap a real provider in behind a port. Pin the newest stable SDK.
anthropic = ["anthropic>=0.107"]
# The OpenAI SDK speaks the chat-completions protocol that *every* OpenAI-compatible runtime
# exposes — Ollama, vLLM, LM Studio, llama.cpp — so one adapter reaches both a local ($0) model
# and the hosted OpenAI API, selected only by `base_url`. That's the "paid <-> local" reach.
openai = ["openai>=2.41"]
voyage = ["voyageai>=0.4"]

[project.urls]
# Repository = "https://github.com/<you>/RaCore"   # fill in when published

[dependency-groups]
# Installed by default on `uv sync`. The dev toolchain = the quality gate. These are DEV-only —
# the runtime core stays dependency-free (ADR-0007). PyYAML (+ its stubs) is here solely so the
# OpenAPI contract test can parse `docs/openapi.yaml` (ADR-0034); it never enters the package.
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pre-commit>=3.8",
    "pyyaml>=6",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racore"]

# --- ruff: linter + formatter (the single source of truth for style) ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F",      # pyflakes + pycodestyle
    "I",            # import sorting
    "UP",           # pyupgrade
    "B",            # bugbear
    "SIM",          # simplify
    "TC",           # type-checking imports (keep type-only imports out of runtime)
    "RUF",          # ruff-specific
]

# --- mypy: strict typing ---
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# `anthropic` is an OPTIONAL extra, absent from the default ($0) dev install. This tells mypy
# its types are unknown when it isn't installed — the standard optional-dependency pattern. It
# does not relax `strict` for any of our own code; the adapter is typed against a local
# `Protocol`, so the core call path is fully checked regardless.
[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

# Same optional-dependency pattern as `anthropic`: `openai` is absent from the default ($0) dev
# install, so its types are unknown when it isn't installed. The adapter is typed against a local
# `Protocol`, so our call path stays fully checked regardless. Keeps the gate green either way.
[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

# Same optional-dependency pattern as `anthropic` above: `voyageai` is absent from the default
# ($0) dev install, so its types are unknown when it isn't installed. `implicit_reexport` is also
# needed *when the extra IS installed*: the SDK re-exports `AsyncClient` without listing it in
# `__all__`, which would trip strict mode's no-implicit-reexport rule on our import. We don't control
# the SDK's exports; the adapter is typed against a local `Protocol`, so our call path stays fully
# checked regardless. Keeps the gate green with or without the extra.
[[tool.mypy.overrides]]
module = "voyageai.*"
ignore_missing_imports = true
implicit_reexport = true

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
